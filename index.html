// ===== Fuso orario: l'admin inserisce sempre l'ora di Roma =====
const FUSO_LEGA = "Europe/Rome";

// Converte una stringa "YYYY-MM-DDTHH:mm" (da un input datetime-local),
// interpretata come orario DI ROMA, nell'istante UTC corrispondente,
// gestendo da sola il passaggio ora legale/solare.
function romaToUtc(dateTimeLocalStr) {
  const guess = new Date(dateTimeLocalStr + "Z");
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: FUSO_LEGA, hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
  const parti = fmt.formatToParts(guess).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
  const oraLocaleDellIpotesi = Date.UTC(
    +parti.year, +parti.month - 1, +parti.day,
    parti.hour === "24" ? 0 : +parti.hour, +parti.minute, +parti.second
  );
  const scarto = oraLocaleDellIpotesi - guess.getTime();
  return new Date(guess.getTime() - scarto);
}
function formatRoma(quando) {
  const d = quando instanceof Date ? quando : new Date(quando);
  return d.toLocaleString("it-IT", { timeZone: FUSO_LEGA, day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function formatRomaData(quando) {
  const d = quando instanceof Date ? quando : new Date(quando);
  return d.toLocaleDateString("it-IT", { timeZone: FUSO_LEGA, day: "2-digit", month: "2-digit", year: "numeric" });
}

// ===== Util per il PIN (Web Crypto nativa del browser, nessuna libreria esterna) =====
function bytesToHex(bytes) {
  return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function hexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}
function randomHex(nBytes) {
  return bytesToHex(crypto.getRandomValues(new Uint8Array(nBytes)));
}
// 100.000 iterazioni: robusto ma resta rapido anche su telefoni poco potenti
// (a differenza della cifratura precedente, che faceva calcoli molto più
// pesanti direttamente nel telefono — quella è stata rimossa).
const PBKDF2_ITERAZIONI = 100000;
async function hashPin(pin, saltHex) {
  const enc = new TextEncoder();
  const salt = saltHex ? hexToBytes(saltHex) : crypto.getRandomValues(new Uint8Array(16));
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt, iterations: PBKDF2_ITERAZIONI, hash: "SHA-256" },
    keyMaterial,
    256
  );
  return { hash: bytesToHex(new Uint8Array(bits)), salt: bytesToHex(salt) };
}
async function verifyPin(pin, saltHex, expectedHashHex) {
  const { hash } = await hashPin(pin, saltHex);
  if (hash.length !== expectedHashHex.length) return false;
  let diff = 0;
  for (let i = 0; i < hash.length; i++) diff |= hash.charCodeAt(i) ^ expectedHashHex.charCodeAt(i);
  return diff === 0;
}
function randomPin4() {
  const n = crypto.getRandomValues(new Uint32Array(1))[0] % 10000;
  return String(n).padStart(4, "0");
}
function slugify(s) {
  return s
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}
function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = String(s == null ? "" : s);
  return d.innerHTML;
}

// ===== Parser CSV (colonne: squadra,giocatore — o più giocatori sulla stessa riga) =====
function parseRosterCsv(text) {
  const righe = text.split("\n").map((r) => r.trim()).filter(Boolean);
  const risultato = {};
  for (const riga of righe) {
    const parti = riga.split(",").map((p) => p.trim()).filter(Boolean);
    if (parti.length < 2) continue;
    const [squadra, ...giocatori] = parti;
    if (squadra.toLowerCase() === "squadra") continue; // riga di intestazione
    if (!risultato[squadra]) risultato[squadra] = [];
    for (const g of giocatori) {
      if (!risultato[squadra].includes(g)) risultato[squadra].push(g);
    }
  }
  return risultato;
}

// ===== Wrapper storage: Firestore =====
// Mappatura chiave -> percorso Firestore:
//   team:<nome>                     -> teams/<nome>
//   finestra:<id>                   -> finestre/<id>
//   roster:<finestraId>             -> rosters/<finestraId>
//   stato:<finestraId>:<team>       -> finestre/<finestraId>/stato/<team>       (sempre leggibile)
//   invio:<finestraId>:<team>       -> finestre/<finestraId>/invii/<team>        (leggibile solo dopo la deadline)
function encId(s) { return encodeURIComponent(s); }
function decId(s) { return decodeURIComponent(s); }

function firestoreRefFor(key) {
  if (key.startsWith("team:")) return db.collection("teams").doc(encId(key.slice("team:".length)));
  if (key.startsWith("finestra:")) return db.collection("finestre").doc(encId(key.slice("finestra:".length)));
  if (key.startsWith("roster:")) return db.collection("rosters").doc(encId(key.slice("roster:".length)));
  if (key.startsWith("stato:")) {
    const resto = key.slice("stato:".length);
    const idx = resto.indexOf(":");
    return db.collection("finestre").doc(encId(resto.slice(0, idx))).collection("stato").doc(encId(resto.slice(idx + 1)));
  }
  if (key.startsWith("invio:")) {
    const resto = key.slice("invio:".length);
    const idx = resto.indexOf(":");
    return db.collection("finestre").doc(encId(resto.slice(0, idx))).collection("invii").doc(encId(resto.slice(idx + 1)));
  }
  throw new Error("Chiave di storage non riconosciuta: " + key);
}

async function sGet(key) {
  try {
    const snap = await firestoreRefFor(key).get();
    if (!snap.exists) return null;
    return snap.data();
  } catch (e) {
    // Include il caso "permission-denied" (es. si prova a leggere un invio
    // prima della deadline): è un esito normale, non un errore da segnalare.
    return null;
  }
}
async function sSet(key, value) {
  await firestoreRefFor(key).set(value);
  return true;
}
async function sListWithData(prefix) {
  try {
    if (prefix === "team:") {
      const snap = await db.collection("teams").get();
      return snap.docs.map((d) => ({ key: "team:" + decId(d.id), data: d.data() }));
    }
    if (prefix === "finestra:") {
      const snap = await db.collection("finestre").get();
      return snap.docs.map((d) => ({ key: "finestra:" + decId(d.id), data: d.data() }));
    }
    if (prefix.startsWith("stato:")) {
      const finestraId = prefix.slice("stato:".length).replace(/:$/, "");
      const snap = await db.collection("finestre").doc(encId(finestraId)).collection("stato").get();
      return snap.docs.map((d) => ({ key: `stato:${finestraId}:` + decId(d.id), data: d.data() }));
    }
    if (prefix.startsWith("invio:")) {
      const finestraId = prefix.slice("invio:".length).replace(/:$/, "");
      const snap = await db.collection("finestre").doc(encId(finestraId)).collection("invii").get();
      return snap.docs.map((d) => ({ key: `invio:${finestraId}:` + decId(d.id), data: d.data() }));
    }
    return [];
  } catch (e) {
    return [];
  }
}
async function sList(prefix) {
  return (await sListWithData(prefix)).map((r) => r.key);
}
// ===================== Stato applicativo =====================
const STATE = { session: null }; // {type:'team', name} | {type:'admin'} | null
let navSeq = 0;

const app = () => document.getElementById("content");
const headerEl = () => document.getElementById("header");
function stale(mySeq) { return mySeq !== navSeq; }

function renderHeader() {
  let nav = "";
  if (STATE.session && STATE.session.type === "team") {
    nav = `
      <a href="#" data-nav="dashboard">Home</a>
      <a href="#" data-nav="storico">Finestre passate</a>
      <a href="#" data-nav="changePin">Cambia PIN</a>
      <a href="#" data-nav="logout">Esci</a>`;
  } else if (STATE.session && STATE.session.type === "admin") {
    nav = `
      <a href="#" data-nav="adminDashboard">Admin</a>
      <a href="#" data-nav="adminTeams">Squadre</a>
      <a href="#" data-nav="logout">Esci</a>`;
  } else {
    nav = `<a href="#" data-nav="adminLogin">Sono l'admin</a>`;
  }
  headerEl().innerHTML = `
    <div class="brand">⚽ Svincoli Segreti</div>
    <nav class="top-nav">${nav}</nav>`;
  headerEl().querySelectorAll("[data-nav]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      const target = el.dataset.nav;
      if (target === "logout") {
        STATE.session = null;
        navigate("home");
      } else {
        navigate(target);
      }
    });
  });
}

async function navigate(screen, params) {
  const mySeq = ++navSeq;
  renderHeader();
  app().innerHTML = `<div class="card empty-state">Un attimo…</div>`;
  try {
    switch (screen) {
      case "home": return renderHome(mySeq);
      case "teamLogin": return renderTeamLogin(mySeq);
      case "forcePinChange": return renderChangePin(mySeq, true);
      case "changePin": return renderChangePin(mySeq, false);
      case "dashboard": return renderDashboard(mySeq);
      case "storico": return renderStorico(mySeq);
      case "submit": return renderSubmit(mySeq, params.finestraId);
      case "reveal": return renderReveal(mySeq, params.finestraId);
      case "adminLogin": return renderAdminLogin(mySeq);
      case "adminDashboard": return renderAdminDashboard(mySeq);
      case "adminTeams": return renderAdminTeams(mySeq);
      case "adminFinestraNew": return renderAdminFinestraNew(mySeq);
      case "adminFinestraDetail": return renderAdminFinestraDetail(mySeq, params.finestraId);
      default: return renderHome(mySeq);
    }
  } catch (e) {
    console.error(e);
    if (mySeq === navSeq) {
      app().innerHTML = `<div class="err">Qualcosa non ha funzionato. Riprova, oppure ricarica la pagina.</div>`;
    }
  }
}

// ===================== Home =====================
function renderHome(mySeq) {
  if (stale(mySeq)) return;
  app().innerHTML = `
    <h1>Svincoli Segreti</h1>
    <p class="lede">Lega FantaFanta Patti. Le liste restano nascoste a tutti — admin compreso — fino all'orario dell'asta.</p>
    <div class="grid-2">
      <div class="card">
        <h3>Sei una squadra</h3>
        <p class="footnote">Entra con il nome della tua squadra e il tuo PIN.</p>
        <button data-go="teamLogin">Entra</button>
      </div>
      <div class="card">
        <h3>Sei l'admin</h3>
        <p class="footnote">Gestisci finestre, squadre e rose.</p>
        <button class="secondary" data-go="adminLogin">Area admin</button>
      </div>
    </div>`;
  wireGoButtons();
}
function wireGoButtons(root = app()) {
  root.querySelectorAll("[data-go]").forEach((el) => {
    el.addEventListener("click", () => navigate(el.dataset.go));
  });
}

// ===================== Login squadra =====================
async function renderTeamLogin(mySeq) {
  const righe = await sListWithData("team:");
  if (stale(mySeq)) return;
  const nomi = righe.map((r) => r.key.slice("team:".length)).sort();
  app().innerHTML = `
    <h1>Entra</h1>
    <p class="lede">Usa il PIN che ti ha dato l'admin (o quello che hai scelto tu, se lo hai già cambiato).</p>
    <div class="card">
      ${nomi.length === 0 ? `<p class="empty-state">Non ci sono ancora squadre. Chiedi all'admin di crearle.</p>` : `
      <label for="teamSelect">La tua squadra</label>
      <select id="teamSelect">${nomi.map((n) => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join("")}</select>
      <label for="pinInput">PIN</label>
      <input type="password" id="pinInput" autocomplete="off" inputmode="numeric">
      <div id="loginErr" class="err" style="display:none"></div>
      <div style="margin-top:18px"><button id="btnLogin">Entra</button></div>
      `}
    </div>`;
  const btn = document.getElementById("btnLogin");
  if (btn) {
    btn.addEventListener("click", async () => {
      const nome = document.getElementById("teamSelect").value;
      const pin = document.getElementById("pinInput").value;
      const errBox = document.getElementById("loginErr");
      errBox.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Un attimo…";
      const team = await sGet("team:" + nome);
      if (!team || !(await verifyPin(pin, team.pinSalt, team.pinHash))) {
        errBox.textContent = "Squadra o PIN sbagliati. Riprova.";
        errBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Entra";
        return;
      }
      STATE.session = { type: "team", name: nome };
      if (stale(mySeq)) return;
      if (!team.pinChanged) {
        await navigate("forcePinChange");
      } else {
        await navigate("dashboard");
      }
    });
  }
}

// ===================== Cambio PIN =====================
async function renderChangePin(mySeq, obbligatorio) {
  if (!STATE.session || STATE.session.type !== "team") return navigate("teamLogin");
  if (stale(mySeq)) return;
  app().innerHTML = `
    <h1>${obbligatorio ? "Scegli il tuo PIN" : "Cambia PIN"}</h1>
    <p class="lede">
      ${obbligatorio
        ? "Stai usando ancora il PIN che ti ha dato l'admin. Scegline uno tuo: da ora in poi l'admin non potrà più entrare al posto tuo."
        : "Il nuovo PIN sostituisce subito quello attuale."}
    </p>
    <div class="card">
      <label for="pinNuovo">Nuovo PIN (almeno 6 caratteri)</label>
      <input type="password" id="pinNuovo" minlength="6">
      <label for="pinConferma">Ripeti il nuovo PIN</label>
      <input type="password" id="pinConferma" minlength="6">
      <div id="cpErr" class="err" style="display:none"></div>
      <div style="margin-top:18px; display:flex; gap:10px">
        <button id="btnSalvaPin">Salva</button>
        ${obbligatorio ? "" : `<button class="secondary" data-go="dashboard">Annulla</button>`}
      </div>
    </div>`;
  wireGoButtons();
  const btn = document.getElementById("btnSalvaPin");
  btn.addEventListener("click", async () => {
    const a = document.getElementById("pinNuovo").value;
    const b = document.getElementById("pinConferma").value;
    const errBox = document.getElementById("cpErr");
    if (a.length < 6) { errBox.textContent = "Il PIN deve avere almeno 6 caratteri."; errBox.style.display = "block"; return; }
    if (a !== b) { errBox.textContent = "I due PIN scritti non sono uguali."; errBox.style.display = "block"; return; }
    btn.disabled = true;
    btn.textContent = "Un attimo…";

async function listFinestre() {
  const righe = await sListWithData("finestra:");
  const finestre = righe.map((r) => normalizzaFinestra(r.data)).filter(Boolean);
  finestre.sort((a, b) => new Date(b.astaIso) - new Date(a.astaIso));
  return finestre;
}
// I dati arrivano da Firestore con "deadline" come Timestamp: qui li
// normalizziamo in campi comodi (Date + ISO string) per il resto del codice.
function normalizzaFinestra(raw) {
  if (!raw) return null;
  const deadlineDate = raw.deadline && raw.deadline.toDate ? raw.deadline.toDate() : new Date(raw.deadlineIso);
  return { ...raw, deadlineDate, deadlineIso: deadlineDate.toISOString() };
}
function isOpen(finestra, now = new Date()) {
  return now < finestra.deadlineDate;
}

function startCountdown() {
  const el = document.getElementById("countdown");
  if (!el) return;
  const deadline = new Date(el.dataset.deadline);
  function tick() {
    if (!document.body.contains(el)) return;
    const diff = deadline.getTime() - Date.now();
    if (diff <= 0) { el.textContent = "Tempo scaduto"; el.classList.add("closed"); return; }
    const s = Math.floor(diff / 1000);
    const parts = [];
    const giorni = Math.floor(s / 86400);
    if (giorni > 0) parts.push(giorni + "g");
    parts.push(String(Math.floor((s % 86400) / 3600)).padStart(2, "0") + "h");
    parts.push(String(Math.floor((s % 3600) / 60)).padStart(2, "0") + "m");
    parts.push(String(s % 60).padStart(2, "0") + "s");
    el.textContent = parts.join(" ");
    setTimeout(tick, 1000);
  }
  tick();
}

async function renderReveal(mySeq, finestraId) {
  if (!STATE.session) return navigate("home");
  const finestraRaw = await sGet("finestra:" + finestraId);
  const finestra = normalizzaFinestra(finestraRaw);
  if (!finestra) return navigate("dashboard");
  if (stale(mySeq)) return;

  app().innerHTML = `
    <h1>${escapeHtml(finestra.label)}</h1>
    <p class="lede">Scadenza invio: ${formatRoma(finestra.deadlineIso)}.</p>
    <div id="revealRoot"><div class="card empty-state">Un attimo…</div></div>
    ${STATE.session.type === "team" ? `<button class="secondary" style="margin-top:14px" data-go="dashboard">← Torna alla home</button>` : ""}`;
  wireGoButtons();

  const root = document.getElementById("revealRoot");

  if (isOpen(finestra)) {
    root.innerHTML = `<div class="card empty-state">Le liste si vedono solo dopo la scadenza (${formatRoma(finestra.deadlineIso)}). Torna qui dopo.</div>`;
    return;
  }

  root.innerHTML = `<div class="card empty-state">Sto aprendo le liste…</div>`;

  let tentativi = 0;
  while (true) {
    if (stale(mySeq)) return;
    const [righeInvio, righeStato] = await Promise.all([
      sListWithData(`invio:${finestraId}:`),
      sListWithData(`stato:${finestraId}:`),
    ]);
    if (stale(mySeq)) return;

    if (righeInvio.length > 0 || righeStato.length === 0 || tentativi >= 5) {
      mostraRivelazione(root, righeInvio, finestraId);
      return;
    }
    // Ci sono squadre che hanno inviato (visto dai marker "stato") ma il
    // contenuto non è ancora leggibile: probabilmente l'orologio di questo
    // dispositivo è un po' avanti rispetto a quello del server. Riprovo.
    tentativi++;
    root.innerHTML = `<div class="card empty-state">Sto aprendo le liste…</div>`;
    await new Promise((res) => setTimeout(res, 2000));
  }
}

function mostraRivelazione(root, righeInvio, finestraId) {
  if (righeInvio.length === 0) {
    root.innerHTML = `<div class="card empty-state">Nessuna squadra ha inviato una lista per questa finestra.</div>`;
    return;
  }
  const prefisso = `invio:${finestraId}:`;
  const html = righeInvio
    .map((r) => {
      const teamName = r.key.slice(prefisso.length);
      const data = r.data || {};
      const giocatori = data.giocatori || [];
      return `<div class="card tight">
        <h3>${escapeHtml(teamName)}</h3>
        <div class="footnote">Inviato: ${data.submittedAtIso ? formatRoma(data.submittedAtIso) : "—"}</div>
        <ul class="reveal-list">${giocatori.map((g) => `<li>${escapeHtml(g)}</li>`).join("")}</ul>
        ${data.numeroDichiarato !== undefined ? `<div class="footnote">Numero dichiarato: ${escapeHtml(data.numeroDichiarato)}</div>` : ""}
      </div>`;
    })
    .join("");
  root.innerHTML = html;
}

    const msgBox = document.getElementById("atMsg");

    if (!nome || pin.length < 4) { errBox.textContent = "Scrivi nome squadra e un PIN di almeno 4 caratteri."; errBox.style.display = "block"; return; }
    if (await sGet("team:" + nome)) { errBox.textContent = "Esiste già una squadra con questo nome."; errBox.style.display = "block"; return; }
    ev.target.disabled = true;
    const { hash, salt } = await hashPin(pin);
    await sSet("team:" + nome, { pinHash: hash, pinSalt: salt, pinChanged: false, createdAtIso: new Date().toISOString() });
    if (stale(mySeq)) return;
    msgBox.textContent = `Squadra "${nome}" creata. Il PIN di partenza è: ${pin}`;
    msgBox.style.display = "block";
    await navigate("adminTeams");
  });

  app().querySelectorAll("[data-reset]").forEach((el) => {
    el.addEventListener("click", async () => {
      const nome = el.dataset.reset;
      if (!confirm(`Dare un nuovo PIN di partenza a "${nome}"? Il PIN attuale smette di funzionare.`)) return;
      el.disabled = true;
      const nuovoPin = randomPin4();
      const { hash, salt } = await hashPin(nuovoPin);
      const existing = (await sGet("team:" + nome)) || {};
      await sSet("team:" + nome, { ...existing, pinHash: hash, pinSalt: salt, pinChanged: false });
      if (stale(mySeq)) return;
      alert(`Nuovo PIN per "${nome}": ${nuovoPin}\nComunicalo alla squadra.`);
      await navigate("adminTeams");
    });
  });
}

// ===================== Avvio =====================
navigate("home");

  </script>
