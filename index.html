<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Svincoli Segreti — FantaFanta Patti</title>
<style>
/* Svincoli Segreti — FantaFanta Patti
   Identità visiva: una "cassaforte" crittografica. Sfondo blu-inchiostro
   notturno, accenti verde-campo per "sbloccato/rivelato" e un rosso-ceralacca
   per i "sigilli" (commitment hash) ancora chiusi. Monospazio per tutto ciò
   che è crittografico (hash, round, orari) — è dato tecnico verificabile,
   non prosa. */

:root {
  --ink: #0e1420;
  --ink-2: #161f30;
  --ink-3: #1f2b40;
  --line: #2b3a54;
  --text: #e7ecf5;
  --text-dim: #9aabc7;
  --seal: #b4483a;       /* ceralacca: sigillo ancora chiuso */
  --seal-glow: #d96650;
  --unlocked: #4caf7d;   /* verde campo: rivelato / ok */
  --unlocked-glow: #6fd6a4;
  --warn: #d9a441;
  --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  --sans: "IBM Plex Sans", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --radius: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100%;
}

body {
  background-image:
    radial-gradient(circle at 15% 0%, rgba(76, 175, 125, 0.07), transparent 40%),
    radial-gradient(circle at 85% 20%, rgba(180, 72, 58, 0.08), transparent 45%);
}

a { color: var(--unlocked-glow); text-decoration: none; }
a:hover { text-decoration: underline; }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}

header.top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 20px 20px 0;
  max-width: 880px;
  margin: 0 auto;
  flex-wrap: wrap;
  gap: 8px;
}

.brand {
  font-family: var(--mono);
  font-weight: 600;
  letter-spacing: 0.02em;
  font-size: 15px;
  color: var(--text-dim);
}
.brand b { color: var(--text); }

nav.top-nav a {
  color: var(--text-dim);
  margin-left: 18px;
  font-size: 14px;
}
nav.top-nav a:hover { color: var(--text); }

h1 {
  font-size: 28px;
  font-weight: 650;
  margin: 8px 0 4px;
  letter-spacing: -0.01em;
}
h2 { font-size: 19px; font-weight: 600; margin: 32px 0 12px; }
h3 { font-size: 15px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }

p.lede { color: var(--text-dim); margin-top: 0; line-height: 1.5; }

.card {
  background: linear-gradient(180deg, var(--ink-2), var(--ink-3));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 18px;
}

.card.tight { padding: 16px 20px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
input[type=text], input[type=password], input[type=number], input[type=datetime-local], select, textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--ink);
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px; /* mai sotto 16px: sotto questa soglia Safari su iPhone
                       zooma automaticamente la pagina quando si tocca il campo */
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--unlocked);
  outline-offset: 1px;
  border-color: var(--unlocked);
}

button, .btn {
  display: inline-block;
  background: var(--unlocked);
  color: #06180f;
  border: none;
  padding: 11px 20px;
  border-radius: 7px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  font-family: var(--sans);
}
button:hover, .btn:hover { background: var(--unlocked-glow); text-decoration: none; }
button:disabled { background: var(--line); color: var(--text-dim); cursor: not-allowed; }
button.secondary, .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
button.secondary:hover, .btn.secondary:hover { border-color: var(--text-dim); background: var(--ink-3); }
button.danger { background: var(--seal); color: #fff; }
button.danger:hover { background: var(--seal-glow); }

.err {
  background: rgba(180, 72, 58, 0.15);
  border: 1px solid var(--seal);
  color: #f3c9c2;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 16px;
}
.ok {
  background: rgba(76, 175, 125, 0.14);
  border: 1px solid var(--unlocked);
  color: #cdeedd;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 16px;
}

.mono { font-family: var(--mono); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-family: var(--mono);
  padding: 3px 9px;
  border-radius: 100px;
  border: 1px solid var(--line);
}
.badge.sealed { color: var(--seal-glow); border-color: var(--seal); }
.badge.unlocked { color: var(--unlocked-glow); border-color: var(--unlocked); }
.badge.pending { color: var(--text-dim); }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--text-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
tr:last-child td { border-bottom: none; }
.table-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.table-scroll table { min-width: 460px; } /* evita che le colonne si schiaccino troppo: scorre invece di rompersi */

.hash {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-dim);
  word-break: break-all;
}

.countdown {
  font-family: var(--mono);
  font-size: 34px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--unlocked-glow);
}
.countdown.closed { color: var(--seal-glow); }
.countdown-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
@media (max-width: 420px) {
  .countdown { font-size: 26px; }
}

.checklist { display: flex; flex-direction: column; gap: 8px; }
.checkitem {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--ink);
}
.checkitem input { width: auto; margin: 0; min-width: 20px; min-height: 20px; } /* area di tocco più comoda su mobile */

.footnote { color: var(--text-dim); font-size: 12.5px; line-height: 1.5; margin-top: 6px; }

.reveal-list { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 0 0; padding-left: 18px; }

.seal-icon::before { content: "🔒"; margin-right: 4px; }
.unlock-icon::before { content: "🔓"; margin-right: 4px; }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-dim);
}

/* Regolazioni per schermi stretti (telefoni) */
@media (max-width: 480px) {
  .wrap { padding: 20px 14px 60px; }
  header.top { padding: 14px 14px 0; }
  h1 { font-size: 23px; }
  .card { padding: 16px; }
}

header.top { padding: 20px 20px 0; max-width: 880px; margin: 0 auto; display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; }
</style>
</head>
<body>
  <div id="header"></div>
  <div class="wrap"><div id="content"></div></div>

function roundAtMs(timeMs) {

// ===== Fuso orario: l'admin inserisce sempre l'ora di Roma =====
const FUSO_LEGA = "Europe/Rome";

// Converte una stringa "YYYY-MM-DDTHH:mm" (così come arriva da un input
// datetime-local), interpretata come orario DI ROMA (gestendo da sola il
// passaggio ora legale/solare), nell'istante UTC corrispondente.
function romaToUtc(dateTimeLocalStr) {
  const guess = new Date(dateTimeLocalStr + "Z"); // ipotesi iniziale: stesso orario, ma UTC
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: FUSO_LEGA, hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
  const parti = fmt.formatToParts(guess).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
  const oraLocaleDellIpotesi = Date.UTC(
    +parti.year, +parti.month - 1, +parti.day,
    parti.hour === "24" ? 0 : +parti.hour, +parti.minute, +parti.second
  );
  const scarto = oraLocaleDellIpotesi - guess.getTime();
  return new Date(guess.getTime() - scarto);
}

// Formatta un istante (Date o ISO string) come orario di Roma leggibile,
// es. "05/09/2026, 20:00" — usato ovunque nell'interfaccia al posto di UTC.
function formatRoma(quando) {
  const d = quando instanceof Date ? quando : new Date(quando);
  return d.toLocaleString("it-IT", { timeZone: FUSO_LEGA, day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function formatRomaData(quando) {
  const d = quando instanceof Date ? quando : new Date(quando);
  return d.toLocaleDateString("it-IT", { timeZone: FUSO_LEGA, day: "2-digit", month: "2-digit", year: "numeric" });
}

// Client per tlock-js che NON fa alcuna chiamata di rete per i parametri di
// chain (sono costanti pubbliche fisse, note in anticipo): usato per la
// CIFRATURA, che quindi non dipende dal raggiungere api.drand.sh in quel
// preciso istante. Per la DECIFRATURA serve invece la firma del round, che
// viene recuperata a parte (vedi fetchBeacon / makeClientWithBeacon).
function offlineDrandChain() {
  return {
    options: { disableBeaconVerification: false, noCache: true },
    chain: () => ({ baseUrl: QUICKNET_URL, info: async () => QUICKNET_CHAIN_INFO }),
    get: async () => { throw new Error("non necessario per la sola cifratura"); },
    latest: async () => { throw new Error("non necessario per la sola cifratura"); },
  };
}

// ===== Util crittografiche (Web Crypto nativa del browser, nessuna libreria esterna) =====
function bytesToHex(bytes) {
  return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function hexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}
function randomHex(nBytes) {
  return bytesToHex(crypto.getRandomValues(new Uint8Array(nBytes)));
}
async function hashPin(pin, saltHex) {
  const enc = new TextEncoder();
  const salt = saltHex ? hexToBytes(saltHex) : crypto.getRandomValues(new Uint8Array(16));
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
    keyMaterial,
    256
  );
  return { hash: bytesToHex(new Uint8Array(bits)), salt: bytesToHex(salt) };
}
async function verifyPin(pin, saltHex, expectedHashHex) {
  const { hash } = await hashPin(pin, saltHex);
  if (hash.length !== expectedHashHex.length) return false;
  let diff = 0;
  for (let i = 0; i < hash.length; i++) diff |= hash.charCodeAt(i) ^ expectedHashHex.charCodeAt(i);
  return diff === 0;
}
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return bytesToHex(new Uint8Array(buf));
}
function randomPin4() {
  const n = crypto.getRandomValues(new Uint32Array(1))[0] % 10000;
  return String(n).padStart(4, "0");
}
function slugify(s) {
  return s
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}
function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = String(s == null ? "" : s);
  return d.innerHTML;
}

// ===== Parser CSV minimale (colonne: squadra,giocatore) =====
// Accetta sia una riga per giocatore ("Squadra,Mario Rossi") sia tutta la
// rosa di una squadra su un'unica riga ("Squadra,Mario Rossi,Luigi Bianchi,
// Marco Verdi") — i due formati si possono anche mischiare liberamente.
function parseRosterCsv(text) {
  const righe = text.split("\n").map((r) => r.trim()).filter(Boolean);
  const risultato = {};
  for (const riga of righe) {
    const parti = riga.split(",").map((p) => p.trim()).filter(Boolean);
    if (parti.length < 2) continue;
    const [squadra, ...giocatori] = parti;
    if (squadra.toLowerCase() === "squadra") continue; // riga di intestazione
    if (!risultato[squadra]) risultato[squadra] = [];
    for (const g of giocatori) {
      if (!risultato[squadra].includes(g)) risultato[squadra].push(g);
    }
  }
  return risultato;
}

// ===== Wrapper storage: Firestore (Firebase) =====
// Stessa interfaccia sGet/sSet/sList usata da tutte le schermate — solo il
// "motore" sotto è cambiato rispetto alla versione ospitata su Claude
// (che usava window.storage, disponibile solo dentro l'ambiente Claude).
//
// Mappatura chiave -> percorso Firestore:
//   team:<nome>                     -> teams/<nome>
//   finestra:<id>                   -> finestre/<id>
//   roster:<finestraId>             -> rosters/<finestraId>
//   submission:<finestraId>:<team>  -> finestre/<finestraId>/submissions/<team>
//
// I nomi (squadra, id finestra) possono contenere caratteri non validi come
// ID documento Firestore (es. "/"): li codifichiamo con encodeURIComponent.
function encId(s) { return encodeURIComponent(s); }
function decId(s) { return decodeURIComponent(s); }

function firestoreRefFor(key) {
  if (key.startsWith("team:")) {
    return db.collection("teams").doc(encId(key.slice("team:".length)));
  }
  if (key.startsWith("finestra:")) {
    return db.collection("finestre").doc(encId(key.slice("finestra:".length)));
  }
  if (key.startsWith("roster:")) {
    return db.collection("rosters").doc(encId(key.slice("roster:".length)));
  }
  if (key.startsWith("submission:")) {
    const resto = key.slice("submission:".length);
    const idx = resto.indexOf(":");
    const finestraId = resto.slice(0, idx);
    const teamName = resto.slice(idx + 1);
    return db.collection("finestre").doc(encId(finestraId)).collection("submissions").doc(encId(teamName));
  }
  throw new Error("Chiave di storage non riconosciuta: " + key);
}

async function sGet(key) {
  try {
    const snap = await firestoreRefFor(key).get();
    if (!snap.exists) return null;
    return snap.data();
  } catch (e) {
    console.error("sGet fallita per", key, e);
    return null;
  }
}
async function sSet(key, value) {
  await firestoreRefFor(key).set(value);
  return true;
}
async function sList(prefix) {
  try {
    if (prefix === "team:") {
      const snap = await db.collection("teams").get();
      return snap.docs.map((d) => "team:" + decId(d.id));
    }
    if (prefix === "finestra:") {
      const snap = await db.collection("finestre").get();
      return snap.docs.map((d) => "finestra:" + decId(d.id));
    }
    if (prefix.startsWith("submission:")) {
      const finestraId = prefix.slice("submission:".length).replace(/:$/, "");
      const snap = await db.collection("finestre").doc(encId(finestraId)).collection("submissions").get();
      return snap.docs.map((d) => `submission:${finestraId}:` + decId(d.id));
    }
    return [];
  } catch (e) {
    console.error("sList fallita per", prefix, e);
    return [];
  }
}
// ===================== Stato applicativo =====================
const STATE = { session: null }; // {type:'team', name} | {type:'admin'} | null
// In-memory soltanto: niente localStorage/sessionStorage per vincolo della
// piattaforma. Se ricarichi la pagina, rientri con nome squadra + PIN.

let navSeq = 0; // token di navigazione: una renderX() in corso che scopre di
// essere stata superata da una navigazione più recente interrompe silenziosamente
// la scrittura sul DOM invece di sovrascrivere per ultima per puro caso di timing.

const app = () => document.getElementById("content");
const headerEl = () => document.getElementById("header");

function renderHeader() {

  headerEl().querySelectorAll("[data-nav]").forEach((el) => {
    el.addEventListener("click", (e) => {

      const target = el.dataset.nav;
      if (target === "logout") {
        STATE.session = null;
        navigate("home");

      }

async function navigate(screen, params) {
  const mySeq = ++navSeq;
  renderHeader();
  app().innerHTML = `<div class="card empty-state">Caricamento…</div>`;
  try {
    switch (screen) {
      case "home": return renderHome(mySeq);
      case "teamLogin": return renderTeamLogin(mySeq);
      case "forcePinChange": return renderChangePin(mySeq, true);
      case "changePin": return renderChangePin(mySeq, false);
      case "dashboard": return renderDashboard(mySeq);
      case "storico": return renderStorico(mySeq);
      case "submit": return renderSubmit(mySeq, params.finestraId);
      case "reveal": return renderReveal(mySeq, params.finestraId);
      case "adminLogin": return renderAdminLogin(mySeq);
      case "adminDashboard": return renderAdminDashboard(mySeq);
      case "adminTeams": return renderAdminTeams(mySeq);
      case "adminFinestraNew": return renderAdminFinestraNew(mySeq);
      case "adminFinestraDetail": return renderAdminFinestraDetail(mySeq, params.finestraId);
      default: return renderHome(mySeq);
    }
  } catch (e) {
    console.error(e);
    if (mySeq === navSeq) {
      app().innerHTML = `<div class="err">Si è verificato un errore: ${escapeHtml(e.message)}</div>`;
    }
  }
}
// Da chiamare subito prima di ogni scrittura "reale" sul DOM dentro una
// renderX() che ha atteso qualcosa (storage, fetch...): se nel frattempo
// l'utente ha già navigato altrove, mySeq non è più il più recente e questa
// scrittura va scartata in silenzio.
function stale(mySeq) { return mySeq !== navSeq; }

// ===================== Home =====================
function renderHome(mySeq) {
  if (stale(mySeq)) return;
  app().innerHTML = `
    <h1>Svincoli Segreti</h1>
    <p class="lede">Lega FantaFanta Patti — invio segreto delle liste di svincolo, cifrato nel tuo browser.</p>

        <h3>Sei una squadra</h3>
        <p class="footnote">Accedi con nome squadra e PIN.</p>
        <button data-go="teamLogin">Accedi</button>
      </div>

        <h3>Sei l'admin</h3>
        <p class="footnote">Configura finestre, squadre e rose.</p>
        <button class="secondary" data-go="adminLogin">Area admin</button>
      </div>
    </div>`;
  wireGoButtons();
}
function wireGoButtons(root = app()) {
  root.querySelectorAll("[data-go]").forEach((el) => {
    el.addEventListener("click", () => navigate(el.dataset.go));
  });
}

// ===================== Login squadra =====================
async function renderTeamLogin(mySeq) {
  const teamKeys = await sList("team:");
  if (stale(mySeq)) return;
  const nomi = teamKeys.map((k) => k.slice("team:".length)).sort();
  app().innerHTML = `
    <h1>Accedi alla tua squadra</h1>
    <p class="lede">Usa il PIN che ti ha comunicato l'admin (o quello che hai scelto tu, se lo hai già cambiato).</p>
    <div class="card">
      ${nomi.length === 0 ? `<p class="empty-state">Nessuna squadra configurata ancora. Chiedi all'admin di crearle.</p>` : `
      <label for="teamSelect">Squadra</label>
      <select id="teamSelect">${nomi.map((n) => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join("")}</select>
      <label for="pinInput">PIN</label>
      <input type="password" id="pinInput" autocomplete="off">
      <div id="loginErr" class="err" style="display:none"></div>
      <div style="margin-top:18px"><button id="btnLogin">Accedi</button></div>
      `}
    </div>`;
  const btn = document.getElementById("btnLogin");
  if (btn) {
    btn.addEventListener("click", async () => {
      const nome = document.getElementById("teamSelect").value;
      const pin = document.getElementById("pinInput").value;
      const errBox = document.getElementById("loginErr");
      errBox.style.display = "none";
      btn.disabled = true;
      const team = await sGet("team:" + nome);
      if (!team || !(await verifyPin(pin, team.pinSalt, team.pinHash))) {
        errBox.textContent = "Nome squadra o PIN errati.";
        errBox.style.display = "block";
        btn.disabled = false;
        return;
      }
      STATE.session = { type: "team", name: nome };
      if (stale(mySeq)) return;
      if (!team.pinChanged) {
        await navigate("forcePinChange");
      } else {
        await navigate("dashboard");
      }
    });
  }
}

// ===================== Cambio PIN (obbligatorio al primo accesso, o volontario) =====================
async function renderChangePin(mySeq, obbligatorio) {
  if (!STATE.session || STATE.session.type !== "team") return navigate("teamLogin");
  if (stale(mySeq)) return;
  app().innerHTML = `
    <h1>${obbligatorio ? "Imposta il tuo PIN personale" : "Cambia PIN"}</h1>
    <p class="lede">
      ${obbligatorio
        ? "Stai usando ancora il PIN iniziale assegnato dall'admin. Scegli subito un PIN tuo: da questo momento l'admin non potrà più accedere al posto tuo."
        : "Il nuovo PIN sostituisce immediatamente quello attuale."}
    </p>
    <div class="card">
      <label for="pinNuovo">Nuovo PIN (minimo 6 caratteri — meglio se non solo numeri)</label>
      <input type="password" id="pinNuovo" minlength="6">
      <label for="pinConferma">Conferma nuovo PIN</label>
      <input type="password" id="pinConferma" minlength="6">
      <div id="cpErr" class="err" style="display:none"></div>
      <div style="margin-top:18px; display:flex; gap:10px">
        <button id="btnSalvaPin">Salva</button>
        ${obbligatorio ? "" : `<button class="secondary" data-go="dashboard">Annulla</button>`}
      </div>
    </div>`;
  wireGoButtons();
  document.getElementById("btnSalvaPin").addEventListener("click", async () => {
    const a = document.getElementById("pinNuovo").value;
    const b = document.getElementById("pinConferma").value;
    const errBox = document.getElementById("cpErr");
    if (a.length < 6) { errBox.textContent = "Il PIN deve avere almeno 6 caratteri."; errBox.style.display = "block"; return; }
    if (a !== b) { errBox.textContent = "I due PIN non coincidono."; errBox.style.display = "block"; return; }
    const { hash, salt } = await hashPin(a);
    const key = "team:" + STATE.session.name;
    const existing = (await sGet(key)) || {};
    await sSet(key, { ...existing, pinHash: hash, pinSalt: salt, pinChanged: true });
    if (stale(mySeq)) return;
    navigate("dashboard");
  });
}

// ===================== Dashboard squadra =====================
async function listFinestre() {
  const keys = await sList("finestra:");
  // Le richieste vengono lanciate tutte insieme (non una dopo l'altra):
  // con un vero database in rete, aspettarle in sequenza sommerebbe la
  // latenza di ognuna invece di pagarla una volta sola.
  const risultati = await Promise.all(keys.map((k) => sGet(k)));
  const finestre = risultati.filter(Boolean);
  finestre.sort((a, b) => new Date(b.astaIso) - new Date(a.astaIso));
  return finestre;
}
function isOpen(finestra, now = new Date()) {
  return now < new Date(finestra.deadlineIso);
}

async function renderDashboard(mySeq) {

  const nome = STATE.session.name;
  const finestre = await listFinestre();

    const mioInvio = squadreInviate.has(nome) ? await sGet(`submission:${aperta.id}:${nome}`) : null;
    const tutteLeSquadre = teamKeys.map((k) => k.slice("team:".length)).sort();

      <div class="card">

        <p class="footnote">
          Asta: ${formatRoma(aperta.astaIso)} ·

        </p>
        <div style="margin-top:16px">
          ${mioInvio
            ? `<span class="badge sealed"><span class="seal-icon"></span>Hai già inviato</span>
               <div class="footnote">Inviato: ${formatRoma(mioInvio.submittedAtIso)}</div>

            : `<span class="badge pending">Non hai ancora inviato</span><br>
               <button style="margin-top:10px" data-go-submit="${aperta.id}">Invia la tua lista di svincoli</button>`}
        </div>
      </div>

      <h2>Stato invii <span class="footnote">(solo chi ha inviato, mai il contenuto)</span></h2>
      <div class="card tight"><div class="table-scroll">
        <table><thead><tr><th>Squadra</th><th>Stato</th></tr></thead><tbody>
          ${tutteLeSquadre.map((s) => `

              <td>${squadreInviate.has(s) ? '<span class="badge sealed"><span class="seal-icon"></span>Inviato</span>' : '<span class="badge pending">In attesa</span>'}</td>
            </tr>`).join("")}
        </tbody></table>
      </div></div>`;
  } else {
    html += `<div class="card empty-state">Nessuna finestra di svincoli attualmente aperta.</div>`;
  }

  if (passate.length) {
    html += `<h2>Finestre passate</h2><div class="card tight">
      ${passate.slice(0, 5).map((f) => `
        <div style="padding:8px 0; border-bottom:1px solid var(--line)">
          <a href="#" data-go-reveal="${f.id}">${escapeHtml(f.label)}</a>
          <span class="footnote"> — ${formatRomaData(f.astaIso)}</span>
        </div>`).join("")}
    </div>`;
  }

  if (stale(mySeq)) return;
  app().innerHTML = html;
  wireGoButtons();
  app().querySelectorAll("[data-go-submit]").forEach((el) =>
    el.addEventListener("click", () => navigate("submit", { finestraId: el.dataset.goSubmit }))
  );
  app().querySelectorAll("[data-go-reveal]").forEach((el) =>
    el.addEventListener("click", (e) => { e.preventDefault(); navigate("reveal", { finestraId: el.dataset.goReveal }); })
  );
  startCountdown();
}

function startCountdown() {
  const el = document.getElementById("countdown");
  if (!el) return;
  const deadline = new Date(el.dataset.deadline);
  function tick() {
    if (!document.body.contains(el)) return; // schermata cambiata: interrompi
    const diff = deadline.getTime() - Date.now();
    if (diff <= 0) { el.textContent = "Deadline raggiunta"; el.classList.add("closed"); return; }
    const s = Math.floor(diff / 1000);
    const parts = [];
    const giorni = Math.floor(s / 86400);
    if (giorni > 0) parts.push(giorni + "g");
    parts.push(String(Math.floor((s % 86400) / 3600)).padStart(2, "0") + "h");
    parts.push(String(Math.floor((s % 3600) / 60)).padStart(2, "0") + "m");
    parts.push(String(s % 60).padStart(2, "0") + "s");
    el.textContent = parts.join(" ");
    setTimeout(tick, 1000);
  }
  tick();
}

      </div>
    </div>
    <div class="card tight footnote">
      <b>Come funziona la segretezza:</b> cifratura time-lock sulla rete pubblica
      <a href="https://drand.love" target="_blank" rel="noopener">drand</a>, round
      <span class="mono">#${finestra.drandRound}</span>. Impossibile decifrare prima che quel
      round venga pubblicato dalla rete, esattamente alla deadline.
    </div>
    <button class="secondary" style="margin-top:14px" data-go="dashboard">← Torna alla dashboard</button>`;
  wireGoButtons();

  document.getElementById("btnInvia").addEventListener("click", async () => {
    const errBox = document.getElementById("formErr");
    const okBox = document.getElementById("formOk");
    const spinner = document.getElementById("spinner");
    const btn = document.getElementById("btnInvia");
    errBox.style.display = "none"; okBox.style.display = "none";

    const selezionati = Array.from(app().querySelectorAll('#rosaList input:checked')).map((el) => el.value);
    const manuale = document.getElementById("manuale").value.split("\n").map((s) => s.trim()).filter(Boolean);
    const giocatori = selezionati.concat(manuale);
    const minDichiarato = parseInt(document.getElementById("minDichiarato").value || "0", 10);

    if (giocatori.length === 0 && !confirm("Non hai selezionato nessun giocatore da svincolare (0 svincoli). Confermi l'invio?")) {
      return;
    }

    btn.disabled = true; spinner.style.display = "inline";
    try {
      const payloadChiaro = { giocatori, numero_dichiarato: minDichiarato, inviato_alle_utc: new Date().toISOString() };
      const payloadBytes = window.TLock.Buffer.from(JSON.stringify(payloadChiaro), "utf-8");
      // Client "offline": i parametri di quicknet sono costanti pubbliche
      // fisse, non serve interrogare la rete per cifrare (a differenza di
      // mainnetClient(), che farebbe comunque una fetch live non necessaria
      // qui). Il round da svelare è già noto: nessuna chiamata di rete è
      // richiesta per completare l'invio.
      const chainClient = offlineDrandChain();
      const ciphertext = await window.TLock.timelockEncrypt(finestra.drandRound, payloadBytes, chainClient);

      const saltHex = randomHex(16);
      const commitmentHash = await sha256Hex(saltHex + ciphertext);

      await sSet(`submission:${finestraId}:${nome}`, {
        ciphertext, commitmentHash, commitmentSalt: saltHex,
        submittedAtIso: new Date().toISOString(),
      });

      scaricaRicevuta({
        squadra: nome, finestra: finestra.label, finestraId, round_drand: finestra.drandRound,
        commitment_hash: commitmentHash, commitment_salt: saltHex, ciphertext,
        nota: "Conserva questo file: dopo la rivelazione puoi verificare che il tuo invio non sia stato alterato, ricalcolando SHA-256(salt + ciphertext).",
      });

      okBox.textContent = "Invio cifrato e registrato. Ricevuta scaricata — torno alla dashboard…";
      okBox.style.display = "block";
      setTimeout(() => { if (!stale(mySeq)) navigate("dashboard"); }, 1600);
    } catch (e) {
      console.error(e);
      errBox.textContent = "Errore durante la cifratura/invio: " + e.message;
      errBox.style.display = "block";
    } finally {
      btn.disabled = false; spinner.style.display = "none";
    }
  });
}

function scaricaRicevuta(payload) {
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ricevuta-svincoli-" + slugify(payload.finestra) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ===================== Rivelazione (decifratura client-side) =====================
async function fetchBeacon(round) {
  const tentativi = [QUICKNET_URL + "/public/" + round, QUICKNET_URL_MIRROR + "/public/" + round];
  let ultimoErrore;
  for (const url of tentativi) {
    try {
      const r = await fetch(url);
      if (r.status === 404) throw Object.assign(new Error("round non ancora pubblicato"), { tooEarly: true });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) {
      ultimoErrore = e;
      if (e.tooEarly) throw e;
    }
  }
  throw ultimoErrore;
}
function makeClientWithBeacon(beacon) {
  return {
    options: { disableBeaconVerification: false, noCache: true },
    chain: () => ({ baseUrl: QUICKNET_URL, info: async () => QUICKNET_CHAIN_INFO }),
    get: async () => beacon,
    latest: async () => beacon,
  };
}
async function verificaSigillo(sub) {
  return (await sha256Hex(sub.commitmentSalt + sub.ciphertext)) === sub.commitmentHash;
}

async function renderReveal(mySeq, finestraId) {
  if (!STATE.session) return navigate("home");
  const finestra = await sGet("finestra:" + finestraId);
  if (!finestra) return navigate("dashboard");
  if (stale(mySeq)) return;

  app().innerHTML = `
    <h1>${escapeHtml(finestra.label)}</h1>
    <p class="lede">
      Deadline / round di rivelazione: ${formatRoma(finestra.deadlineIso)}
      (round drand <span class="mono">#${finestra.drandRound}</span>). La decifratura avviene
      interamente in questo browser.
    </p>
    <div id="revealRoot"><div class="card empty-state">Caricamento…</div></div>
    ${STATE.session.type === "team" ? `<button class="secondary" style="margin-top:14px" data-go="dashboard">← Torna alla dashboard</button>` : ""}`;
  wireGoButtons();

  const root = document.getElementById("revealRoot");
  const submissionKeys = await sList(`submission:${finestraId}:`);
  if (submissionKeys.length === 0) {
    root.innerHTML = `<div class="card empty-state">Nessuna squadra ha inviato una lista per questa finestra.</div>`;
    return;
  }
  const submissioniGrezze = await Promise.all(
    submissionKeys.map(async (k) => {
      const teamName = k.slice(`submission:${finestraId}:`.length);
      const sub = await sGet(k);
      return sub ? { teamName, ...sub } : null;
    })
  );
  const submissions = submissioniGrezze.filter(Boolean);

  root.innerHTML = `<div class="card empty-state">In attesa della firma drand per il round #${finestra.drandRound} — la rivelazione è possibile solo da questo istante in poi…</div>`;

  let beacon = null;
  let tentativiFalliti = 0;
  while (!beacon) {
    if (stale(mySeq)) return; // l'utente ha lasciato questa schermata: smetto di interrogare la rete in background
    try {
      beacon = await fetchBeacon(finestra.drandRound);
    } catch (e) {
      if (e.tooEarly) {
        await new Promise((res) => setTimeout(res, 3000));
        continue;
      }
      tentativiFalliti++;
      if (tentativiFalliti >= 3) {
        if (!stale(mySeq)) renderFallbackManuale(root, finestra, submissions);
        return;
      }
      await new Promise((res) => setTimeout(res, 3000));
    }
  }
  if (!stale(mySeq)) await mostraDecifrato(root, finestra, submissions, beacon);
}

function renderFallbackManuale(root, finestra, submissions) {
  const url = QUICKNET_URL + "/public/" + finestra.drandRound;
  root.innerHTML = `
    <div class="card">
      <h3>Recupero automatico non riuscito</h3>
      <p class="footnote">
        Il browser non riesce a contattare la rete drand direttamente (può succedere per via di

        nessuna garanzia di sicurezza — il dato è comunque pubblico:
      </p>
      <ol class="footnote">
        <li>Apri <a href="${url}" target="_blank" rel="noopener">questo link</a> in una nuova scheda</li>
        <li>Copia tutto il contenuto JSON che vedi</li>
        <li>Incollalo qui sotto</li>
      </ol>
      <textarea id="beaconManuale" rows="4" placeholder='{"round":..., "randomness":"...", "signature":"..."}'></textarea>
      <div id="fbErr" class="err" style="display:none"></div>
      <div style="margin-top:14px"><button id="btnUsaBeacon">Usa questo dato per decifrare</button></div>
    </div>`;
  document.getElementById("btnUsaBeacon").addEventListener("click", async () => {
    const errBox = document.getElementById("fbErr");
    try {
      const beacon = JSON.parse(document.getElementById("beaconManuale").value);

    }
  });

async function mostraDecifrato(root, finestra, submissions, beacon) {
  const client = makeClientWithBeacon(beacon);
  let html = `<div class="card tight">
    <span class="badge unlocked"><span class="unlock-icon"></span>Round #${finestra.drandRound} rivelato</span>
    <span class="footnote">Firma verificata crittograficamente contro la chiave pubblica di quicknet.</span>
  </div>`;
  for (const sub of submissions) {
    try {
      const sigilloOk = await verificaSigillo(sub);
      const plainBuf = await window.TLock.timelockDecrypt(sub.ciphertext, client);
      const payload = JSON.parse(new TextDecoder().decode(plainBuf));
      const giocatori = payload.giocatori || [];
      html += `<div class="card tight">
        <h3>${escapeHtml(sub.teamName)}</h3>
        ${sigilloOk ? '<span class="badge unlocked">sigillo verificato</span>' : '<span class="badge sealed">⚠ sigillo NON corrisponde</span>'}
        <div class="footnote">Inviato: ${formatRoma(sub.submittedAtIso)}</div>
        <ul class="reveal-list">${giocatori.map((g) => `<li>${escapeHtml(g)}</li>`).join("")}</ul>
        ${payload.numero_dichiarato ? `<div class="footnote">Numero dichiarato: ${escapeHtml(payload.numero_dichiarato)}</div>` : ""}
      </div>`;
    } catch (e) {
      console.error("Errore decifrando invio di " + sub.teamName, e);
      html += `<div class="card tight"><h3>${escapeHtml(sub.teamName)}</h3><span class="badge sealed">Errore nella decifratura: ${escapeHtml(e.message)}</span></div>`;
    }
  }
  root.innerHTML = html;
}

    const nSquadre = Object.keys(parsed).length;
    const nGiocatori = Object.values(parsed).reduce((a, arr) => a + arr.length, 0);
    const nonRiconosciute = Object.keys(parsed).filter((s) => !tutteLeSquadre.includes(s));
    msg.textContent = `Importate ${nGiocatori} righe per ${nSquadre} squadre.` +
      (nonRiconosciute.length ? ` Attenzione, nomi non corrispondenti a squadre esistenti: ${nonRiconosciute.join(", ")}` : "");
    msg.style.display = "block";
  });
}

async function renderAdminTeams(mySeq) {
  if (!requireAdmin()) return;
  const teamKeys = await sList("team:");
  const squadreGrezze = await Promise.all(
    teamKeys.map(async (k) => {
      const t = await sGet(k);
      return t ? { name: k.slice("team:".length), ...t } : null;
    })
  );
  const squadre = squadreGrezze.filter(Boolean);
  squadre.sort((a, b) => a.name.localeCompare(b.name));
  if (stale(mySeq)) return;

  app().innerHTML = `
    <h1>Squadre della lega</h1>
    <p class="lede">
      Crea qui le squadre assegnando un PIN iniziale (puoi lasciare quello proposto o sceglierne
      uno tu). La squadra dovrà cambiarlo al primo accesso: da quel momento tu non potrai più
      conoscerlo, potrai solo assegnarne uno nuovo se lo dimentica.
    </p>
    <div class="card">
      <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap">
        <div style="flex:1; min-width:180px">
          <label for="newTeamName">Nome nuova squadra</label>
          <input type="text" id="newTeamName">
        </div>
        <div style="width:120px">
          <label for="newTeamPin">PIN iniziale</label>
          <input type="text" id="newTeamPin" value="${randomPin4()}">
        </div>
        <button id="btnAggiungiSquadra">Aggiungi</button>
      </div>
      <div id="atMsg" class="ok" style="display:none"></div>
      <div id="atErr" class="err" style="display:none"></div>
    </div>

    <div class="card tight"><div class="table-scroll">
      <table><thead><tr><th>Squadra</th><th>Stato</th><th></th></tr></thead><tbody>
        ${squadre.map((s) => `
          <tr>
            <td>${escapeHtml(s.name)}</td>
            <td>${s.pinChanged ? '<span class="badge unlocked">PIN personale attivo</span>' : '<span class="badge pending">PIN iniziale non ancora cambiato</span>'}</td>
            <td><button class="danger" data-reset="${escapeHtml(s.name)}">Assegna nuovo PIN iniziale</button></td>
          </tr>`).join("")}
      </tbody></table>
    </div></div>`;

  document.getElementById("btnAggiungiSquadra").addEventListener("click", async (ev) => {
    const nome = document.getElementById("newTeamName").value.trim();
    const pin = document.getElementById("newTeamPin").value.trim();
    const errBox = document.getElementById("atErr");
    const msgBox = document.getElementById("atMsg");
    errBox.style.display = "none"; msgBox.style.display = "none";
    if (!nome || pin.length < 4) { errBox.textContent = "Nome squadra e PIN (min. 4 caratteri) obbligatori."; errBox.style.display = "block"; return; }
    if (await sGet("team:" + nome)) { errBox.textContent = "Esiste già una squadra con questo nome."; errBox.style.display = "block"; return; }
    ev.target.disabled = true;
    const { hash, salt } = await hashPin(pin);
    await sSet("team:" + nome, { pinHash: hash, pinSalt: salt, pinChanged: false, createdAtIso: new Date().toISOString() });
    if (stale(mySeq)) return; // l'utente ha già lasciato questa schermata
    msgBox.textContent = `Squadra "${nome}" creata. Comunica questo PIN iniziale: ${pin}`;
    msgBox.style.display = "block";
    await navigate("adminTeams");
  });

  app().querySelectorAll("[data-reset]").forEach((el) => {
    el.addEventListener("click", async () => {
      const nome = el.dataset.reset;
      if (!confirm(`Assegnare un nuovo PIN iniziale a "${nome}"? Il PIN attuale smetterà di funzionare.`)) return;
      el.disabled = true;
      const nuovoPin = randomPin4();
      const { hash, salt } = await hashPin(nuovoPin);
      const existing = (await sGet("team:" + nome)) || {};
      await sSet("team:" + nome, { ...existing, pinHash: hash, pinSalt: salt, pinChanged: false });
      if (stale(mySeq)) return; // l'utente ha già lasciato questa schermata: non interrompo il salvataggio ma evito di navigare/avvisare a schermata sbagliata
      alert(`Nuovo PIN iniziale per "${nome}": ${nuovoPin}\nComunicalo alla squadra.`);
      await navigate("adminTeams");
    });
  });
}

// ===================== Avvio =====================
navigate("home");

  </script>
